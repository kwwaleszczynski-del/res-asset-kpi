# ILLUSTRATIVE guarantee clauses of a PV O&M contract, for testing the calculation. Not taken from any real
# agreement: thresholds, exclusions, the damages formulas and the caps must be checked against the actual
# contract, which always prevails. Not legal advice.
name: Illustrative PV O&M contract
asset: pv
currency: EUR
period: year                    # month | quarter | year | contract_year (needs contract_start)
contract_start: null

# event-log categories outside the contractor's responsibility: removed from the availability count and from
# the PR intervals
excluded_events: [force_majeure, grid_operator_instruction, grid_outage]
planned_maintenance:
  allowance_h: 24               # capacity-weighted daylight hours per period; beyond them it counts as downtime

guarantees:
  availability:
    basis: time                 # time | energy (res_asset_kpi.pv.availability)
    guaranteed: 0.98
    parameters: {daylight_wm2: 50}
    damages:                    # (guaranteed - measured) x expected energy of the counted intervals x price
      method: energy
      price_per_mwh: 60.0
      cap: 20000.0
    bonus: {threshold: 0.995, share: 0.5, price_per_mwh: 60.0}

  performance_ratio:
    basis: pr_wc                # pr | pr_25 | pr_wc (res_asset_kpi.pv.performance)
    guaranteed: 0.78            # contract year 1
    annual_degradation: 0.005   # relative step-down per contract year
    tolerance: 0.02             # measurement uncertainty deducted from the guaranteed value
    min_data_share: 0.8         # below this share of valid daylight intervals the test is inconclusive
    parameters: {min_irradiance_wm2: 50, exclude_curtailment: true}
    damages:                    # (guaranteed - measured) x reference energy of the same intervals x price
      method: energy
      price_per_mwh: 60.0
      cap: 50000.0
