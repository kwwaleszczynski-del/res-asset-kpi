[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "res-asset-kpi"
dynamic = ["version"]
description = "Key performance indicators for operating PV, wind and battery assets: performance ratio, availability, energy bridges, power curves, reliability, round-trip efficiency, cycles and capacity tests."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Konrad Waleszczyński" }]
keywords = [
    "renewable-energy", "photovoltaics", "wind-energy", "battery-storage", "asset-management", "kpi",
    "performance-ratio", "availability", "power-curve", "reliability", "round-trip-efficiency", "rainflow",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.1",
    "scipy>=1.10",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML",
    "build>=1.2",
]
docs = ["mkdocs>=1.6", "mkdocs-material>=9.5", "mkdocstrings[python]>=0.26"]
examples = ["pyarrow>=14"]

[project.urls]
Homepage = "https://github.com/kwwaleszczynski-del/res-asset-kpi"
Documentation = "https://kwwaleszczynski-del.github.io/res-asset-kpi/"
Changelog = "https://github.com/kwwaleszczynski-del/res-asset-kpi/blob/main/CHANGELOG.md"
Issues = "https://github.com/kwwaleszczynski-del/res-asset-kpi/issues"

[tool.setuptools.dynamic]
version = { attr = "res_asset_kpi._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
res_asset_kpi = ["py.typed", "data/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
addopts = "--doctest-modules"
doctest_optionflags = ["NORMALIZE_WHITESPACE", "ELLIPSIS"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["res_asset_kpi"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "@overload"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests", "examples", "validation"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY", "PD002", "RUF100"]

[tool.ruff.lint.isort]
known-first-party = ["res_asset_kpi"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true
warn_return_any = false

[[tool.mypy.overrides]]
module = ["pandas", "pandas.*", "scipy", "scipy.*"]
ignore_missing_imports = true
